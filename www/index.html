<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حاسبة المرتبات">
    <title>نظام المرتبات والدوام - المبرمج عمر الصلاحي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(env(safe-area-inset-bottom) + 85px);
            overflow-x: hidden;
        }
        .ios-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }
        .ios-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .btn-active:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        input, select {
            user-select: auto;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <header class="px-5 pt-6 pb-4 sticky top-0 z-30 bg-[#0b0f19]/80 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-xl font-extrabold bg-gradient-to-l from-emerald-400 to-cyan-400 bg-clip-text text-transparent">حاسبة المرتبات والدوام</h1>
                <p class="text-xs text-slate-400 mt-0.5">نظام الفترتين المعتمد (10:00 - 4:00 | 4:00 - 10:00)</p>
            </div>
            <div class="text-left">
                <span class="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-bold">iOS Pro</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="px-4 py-4 space-y-5 max-w-md mx-auto">

        <!-- Summary Cards -->
        <div class="grid grid-cols-3 gap-2.5">
            <div class="ios-card p-3.5 text-center">
                <p class="text-[11px] text-slate-400">الموظفين</p>
                <p id="statEmployees" class="text-lg font-extrabold text-white mt-1">0</p>
            </div>
            <div class="ios-card p-3.5 text-center">
                <p class="text-[11px] text-slate-400">إجمالي الساعات</p>
                <p id="statHours" class="text-lg font-extrabold text-cyan-400 mt-1">0</p>
            </div>
            <div class="ios-card p-3.5 text-center">
                <p class="text-[11px] text-slate-400">إجمالي المرتبات</p>
                <p id="statPayroll" class="text-lg font-extrabold text-emerald-400 mt-1">0 د.ل</p>
            </div>
        </div>

        <!-- Tab 1: Attendance & Shifts -->
        <section id="tabAttendance" class="space-y-4">
            <div class="ios-card p-4 space-y-4">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    تسجيل دوام يومي للموظف
                </h2>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-300 block mb-1.5">اختر الموظف</label>
                        <select id="attEmployeeSelect" class="w-full bg-slate-900/90 border border-white/10 rounded-xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="">-- اختر موظفاً --</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs text-slate-300 block mb-1.5">تاريخ الدوام</label>
                        <input type="date" id="attDate" class="w-full bg-slate-900/90 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>

                    <div>
                        <label class="text-xs text-slate-300 block mb-2">فترة الدوام (كل فترة 6 ساعات)</label>
                        <div class="grid grid-cols-1 gap-2">
