<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مرتبات الموظفين">
    <title>نظام المرتبات والدوام - المبرمج عمر الصلاحي</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #161f33;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #10b981;
            --cyan: #06b6d4;
            --text: #f8fafc;
            --muted: #94a3b8;
            --danger: #f43f5e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding-top: env(safe-area-inset-top);
            padding-bottom: 100px;
            min-height: 100vh;
        }
        header {
            padding: 18px 16px;
            background: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .header-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }
        .header-sub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }
        .badge {
            background: rgba(16, 185, 129, 0.12);
            color: var(--primary);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .stat-box {
            text-align: center;
            padding: 12px 8px;
            margin-bottom: 0;
        }
        .stat-label {
            font-size: 11px;
            color: var(--muted);
        }
        .stat-val {
            font-size: 17px;
            font-weight: 800;
            margin-top: 4px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }
        .shift-btn {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: right;
            cursor: pointer;
        }
        .shift-btn.active {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.12);
        }
        .shift-name {
            font-size: 13px;
            font-weight: 700;
        }
        .shift-time {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }
        .shift-tag {
            background: var(--primary);
            color: #052e16;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-main {
            width: 100%;
            background: var(--primary);
            color: #052e16;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            margin-top: 14px;
            cursor: pointer;
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        .item-row {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-del {
            background: rgba(244, 63, 94, 0.15);
            color: var(--danger);
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .hidden {
            display: none !important;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            z-index: 30;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--muted);
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            gap: 4px;
        }
        .nav-item.active {
            color: var(--primary);
        }
        footer {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            padding: 16px 0;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="header-title">نظام المرتبات والدوام</div>
            <div class="header-sub">الفترة 1 (10:00 - 4:00) | الفترة 2 (4:00 - 10:00)</div>
        </div>
        <span class="badge">المبرمج عمر</span>
    </header>

    <div class="container">
        <!-- الملخص العلوي -->
        <div class="stats-grid">
            <div class="card stat-box">
                <div class="stat-label">الموظفين</div>
                <div id="stat-employees" class="stat-val">0</div>
            </div>
            <div class="card stat-box">
                <div class="stat-label">مجموع الساعات</div>
                <div id="stat-hours" class="stat-val" style="color: var(--cyan)">0</div>
            </div>
            <div class="card stat-box">
                <div class="stat-label">إجمالي المرتبات</div>
                <div id="stat-total" class="stat-val" style="color: var(--primary)">0 د.ل</div>
            </div>
        </div>

        <!-- تبويب تسجيل الدوام -->
        <div id="tab-shifts">
            <div class="card">
                <div class="section-title"><span class="dot"></span> تسجيل دوام فترة</div>
                
                <label>اختر الموظف</label>
                <select id="shift-emp"></select>

                <label>تاريخ اليوم</label>
                <input type="date" id="shift-date">

                <label>فترة الدوام (6 ساعات لكل فترة)</label>
                <button type="button" id="btn-morning" class="shift-btn active" onclick="selectShift('morning')">
                    <div>
                        <div class="shift-name">الفترة الأولى (الصباحية)</div>
                        <div class="shift-time">من الساعة 10:00 إلى 4:00</div>
                    </div>
                    <span class="shift-tag">6 ساعات</span>
                </button>

                <button type="button" id="btn-evening" class="shift-btn" onclick="selectShift('evening')">
                    <div>
                        <div class="shift-name">الفترة الثانية (المسائية)</div>
                        <div class="shift-time">من الساعة 4:00 إلى 10:00</div>
                    </div>
                    <span class="shift-tag">6 ساعات</span>
                </button>

                <button type="button" id="btn-double" class="shift-btn" onclick="selectShift('double')">
                    <div>
                        <div class="shift-name">دوام فترتين كاملتين</div>
                        <div class="shift-time">من الساعة 10:00 إلى 10:00</div>
                    </div>
                    <span class="shift-tag">12 ساعة</span>
                </button>

                <div class="row-2">
                    <div>
                        <label>عدد الساعات الفعلي</label>
                        <input type="number" id="shift-hours" value="6" step="0.5">
                    </div>
                    <div>
                        <label>مكافأة أو خصم (د.ل)</label>
                        <input type="number" id="shift-bonus" value="0">
                    </div>
                </div>

                <button class="btn-main" onclick="addShiftLog()">حفظ وتسجيل الدوام</button>
            </div>

            <div class="card">
                <div class="section-title">سجل الدوام الأخير</div>
                <div id="logs-list"></div>
            </div>
        </div>

        <!-- تبويب الموظفين -->
        <div id="tab-employees" class="hidden">
            <div class="card">
                <div class="section-title">إضافة موظف جديد</div>
                <label>اسم الموظف</label>
                <input type="text" id="emp-name" placeholder="أدخل اسم الموظف">
                <div class="row-2">
                    <div>
                        <label>الوظيفة / القسم</label>
                        <input type="text" id="emp-role" placeholder="مثال: مبيعات">
                    </div>
                    <div>
                        <label>سعر الساعة (د.ل)</label>
                        <input type="number" id="emp-rate" placeholder="مثال: 15">
                    </div>
                </div>
                <button class="btn-main" onclick="addEmployee()">+ إضافة الموظف</button>
            </div>

            <div class="card">
                <div class="section-title">قائمة الموظفين</div>
                <div id="emp-list"></div>
            </div>
        </div>

        <!-- تبويب كشف المرتبات -->
        <div id="tab-payroll" class="hidden">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div class="section-title" style="margin:0;">كشف المرتبات النهائي</div>
                    <button onclick="window.print()" style="background:#334155; color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700;">طباعة / PDF</button>
                </div>
                <div id="payroll-report"></div>
            </div>
        </div>

        <footer>
            تصميم وبرمجة: <b style="color:#fff;">المبرمج عمر الصلاحي</b> &copy; 2026
        </footer>
    </div>

    <!-- القائمة السفلية -->
    <nav class="bottom-nav">
        <button id="nav-shifts" class="nav-item active" onclick="switchTab('shifts')">
            <span style="font-size:18px;">⏱️</span>
            <span>تسجيل الدوام</span>
        </button>
        <button id="nav-employees" class="nav-item" onclick="switchTab('employees')">
            <span style="font-size:18px;">👥</span>
            <span>الموظفين</span>
        </button>
        <button id="nav-payroll" class="nav-item" onclick="switchTab('payroll')">
            <span style="font-size:18px;">💰</span>
            <span>المرتبات</span>
        </button>
    </nav>

    <script>
        let employees = JSON.parse(localStorage.getItem('omar_ios_emp')) || [
            { id: 1, name: 'أحمد محمد', role: 'مبيعات', rate: 15 },
            { id: 2, name: 'سالم علي', role: 'محاسب', rate: 20 }
        ];
        let logs = JSON.parse(localStorage.getItem('omar_ios_logs')) || [];
        let currentShiftType = 'الفترة الأولى (10:00 - 4:00)';

        document.getElementById('shift-date').valueAsDate = new Date();

        function saveData() {
            localStorage.setItem('omar_ios_emp', JSON.stringify(employees));
            localStorage.setItem('omar_ios_logs', JSON.stringify(logs));
            renderAll();
        }

        function switchTab(tab) {
            ['shifts', 'employees', 'payroll'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('nav-' + t).classList.remove('active');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('nav-' + tab).classList.add('active');
            renderAll();
        }

        function selectShift(type) {
            ['morning', 'evening', 'double'].forEach(b => {
                document.getElementById('btn-' + b).classList.remove('active');
            });
            document.getElementById('btn-' + type).classList.add('active');
            if (type === 'morning') {
                document.getElementById('shift-hours').value = 6;
                currentShiftType = 'الفترة الأولى (10:00 - 4:00)';
            } else if (type === 'evening') {
                document.getElementById('shift-hours').value = 6;
                currentShiftType = 'الفترة الثانية (4:00 - 10:00)';
            } else {
                document.getElementById('shift-hours').value = 12;
                currentShiftType = 'فترتين (10:00 - 10:00)';
            }
        }

        function addEmployee() {
            const name = document.getElementById('emp-name').value.trim();
            const role = document.getElementById('emp-role').value.trim() || 'موظف';
            const rate = parseFloat(document.getElementById('emp-rate').value);
            if (!name || isNaN(rate) || rate <= 0) return alert('يرجى إدخال اسم الموظف وسعر الساعة');
            employees.push({ id: Date.now(), name, role, rate });
            document.getElementById('emp-name').value = '';
            document.getElementById('emp-role').value = '';
            document.getElementById('emp-rate').value = '';
            saveData();
        }

        function deleteEmployee(id) {
            if (!confirm('حذف هذا الموظف؟')) return;
            employees = employees.filter(e => e.id !== id);
            logs = logs.filter(l => l.empId !== id);
            saveData();
        }

        function addShiftLog() {
            const empId = parseInt(document.getElementById('shift-emp').value);
            const date = document.getElementById('shift-date').value;
            const hours = parseFloat(document.getElementById('shift-hours').value);
            const bonus = parseFloat(document.getElementById('shift-bonus').value) || 0;
            const emp = employees.find(e => e.id === empId);
            if (!emp || isNaN(hours) || hours <= 0) return alert('اختر الموظف وحدد الساعات');

            const totalPay = (hours * emp.rate) + bonus;
            logs.unshift({
                id: Date.now(),
                empId: emp.id,
                empName: emp.name,
                date,
                shift: currentShiftType,
                hours,
                rate: emp.rate,
                bonus,
                totalPay
            });
            document.getElementById('shift-bonus').value = 0;
            saveData();
        }

        function deleteLog(id) {
            logs = logs.filter(l => l.id !== id);
            saveData();
        }

        function renderAll() {
            const select = document.getElementById('shift-emp');
            select.innerHTML = employees.map(e => `<option value="${e.id}">${e.name} (${e.rate} د.ل/ساعة)</option>`).join('');

            const totalHours = logs.reduce((sum, l) => sum + l.hours, 0);
            const totalPay = logs.reduce((sum, l) => sum + l.totalPay, 0);
            document.getElementById('stat-employees').innerText = employees.length;
            document.getElementById('stat-hours').innerText = totalHours;
            document.getElementById('stat-total').innerText = totalPay.toFixed(1) + ' د.ل';

            const logsContainer = document.getElementById('logs-list');
            logsContainer.innerHTML = logs.length ? logs.map(l => `
                <div class="item-row">
                    <div>
                        <div style="font-size:13px; font-weight:700;">${l.empName} <span style="color:var(--primary)">(${l.totalPay} د.ل)</span></div>
                        <div style="font-size:11px; color:var(--muted); margin-top:2px;">${l.date} | ${l.shift} (${l.hours} س)</div>
                    </div>
                    <button class="btn-del" onclick="deleteLog(${l.id})">حذف</button>
                </div>
            `).join('') : '<div style="text-align:center; color:var(--muted); font-size:12px; padding:12px;">لا توجد سجلات دوام بعد</div>';

            const empContainer = document.getElementById('emp-list');
            empContainer.innerHTML = employees.map(e => `
                <div class="item-row">
                    <div>
                        <div style="font-size:14px; font-weight:700;">${e.name}</div>
                        <div style="font-size:11px; color:var(--muted); margin-top:2px;">${e.role} • الساعة: <b style="color:var(--cyan)">${e.rate} د.ل</b></div>
                    </div>
                    <button class="btn-del" onclick="deleteEmployee(${e.id})">حذف</button>
                </div>
            `).join('');

            const reportContainer = document.getElementById('payroll-report');
            reportContainer.innerHTML = employees.map(e => {
                const empLogs = logs.filter(l => l.empId === e.id);
                const empHours = empLogs.reduce((s, l) => s + l.hours, 0);
                const empBonus = empLogs.reduce((s, l) => s + l.bonus, 0);
                const empTotal = empLogs.reduce((s, l) => s + l.totalPay, 0);
                return `
                    <div class="item-row" style="display:block; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:8px;">
                            <div>
                                <div style="font-size:14px; font-weight:800;">${e.name}</div>
                                <div style="font-size:11px; color:var(--muted);">${e.role} (${e.rate} د.ل/ساعة)</div>
                            </div>
                            <div style="font-size:16px; font-weight:800; color:var(--primary);">${empTotal.toFixed(1)} د.ل</div>
                        </div>
                        <div style="display:grid; grid-template-columns:repeat(3,1fr); text-align:center; font-size:12px;">
                            <div><span style="color:var(--muted); font-size:10px; display:block;">الفترات</span><b>${empLogs.length}</b></div>
                            <div><span style="color:var(--muted); font-size:10px; display:block;">الساعات</span><b style="color:var(--cyan)">${empHours} س</b></div>
                            <div><span style="color:var(--muted); font-size:10px; display:block;">مكافأة/خصم</span><b style="color:#fbbf24">${empBonus} د.ل</b></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderAll();
    </script>
</body>
</html>
